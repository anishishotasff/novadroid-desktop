name: novadroid_desktop
description: "Android Desktop - Control your Android device from Windows PC"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.2
  
  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  cached_network_image: ^3.3.1
  animations: ^2.0.11
  
  # Utilities
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  
  # System Integration
  window_manager: ^0.3.9
  tray_manager: ^0.2.3
  launch_at_startup: ^0.3.0
  
  # Networking
  web_socket_channel: ^2.4.5
  http: ^1.2.1
  
  # Database/Storage
  sqflite_common_ffi: ^2.3.3
  
  # Logging
  logger: ^2.3.0
  
  # Process Management
  process_run: ^0.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/wallpapers/
